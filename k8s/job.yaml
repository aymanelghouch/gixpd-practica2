apiVersion: batch/v1
kind: Job
metadata:
  name: model-train
spec:
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: train
          image: model-train:default
          imagePullPolicy: Never
          env:
            - name: MODEL_PATH
              valueFrom:
                configMapKeyRef:
                  name: model-config
                  key: MODEL_PATH
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: model-storage
              mountPath: /models
      volumes:
        - name: model-storage
          persistentVolumeClaim:
            claimName: model-pvc
